<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Spectral:wght@300;500&display=swap">
  <style>
    body { margin: 0; background: #ede6da; font-family: Archivo, system-ui, sans-serif; color: #221b1a; -webkit-font-smoothing: antialiased; }
    a { color: #8a2632; } a:hover { color: #6d1e28; }
    .eyebrow { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .16em; color: #69605c; }
    .serif { font-family: Spectral, Georgia, serif; font-weight: 300; }
    .quiet { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: #69605c; }
    .crumb { background: none; border: 0; padding: 0; cursor: pointer; font-family: Archivo, sans-serif; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; }
    .hot { cursor: pointer; }
    .hot:hover circle.mark { stroke: #221b1a; }
    .row { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 12px 0; border: 0; border-bottom: 1px solid #d3c8b6; background: none; width: 100%; text-align: left; cursor: pointer; font-family: Archivo, sans-serif; }
  </style>
</helmet>

<div style="min-height: 100%; background: #ede6da; padding: 26px 20px 40px; display: flex; flex-direction: column; gap: 18px">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <span class="quiet">← All wines</span>
    <span class="eyebrow">The map</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 7px">
    <h1 class="serif" style="margin: 0; font-size: 30px; line-height: 1.12">{{title}}</h1>
    <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #514846">{{subtitle}}</p>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
    <button class="crumb" onClick="{{goWorld}}" style="{{worldCrumbStyle}}">World</button>
    <sc-if value="{{inCountry}}" hint-placeholder-val="{{ true }}">
      <span style="color: #a2988f; font-size: 11px">/</span>
      <button class="crumb" onClick="{{goCountry}}" style="{{countryCrumbStyle}}">{{countryName}}</button>
    </sc-if>
    <sc-if value="{{inRegion}}" hint-placeholder-val="{{ true }}">
      <span style="color: #a2988f; font-size: 11px">/</span>
      <span class="crumb" style="color: #221b1a">{{regionName}}</span>
    </sc-if>
  </div>

  <sc-if value="{{showMap}}" hint-placeholder-val="{{ true }}">
    <div style="border-top: 1px solid #d3c8b6; border-bottom: 1px solid #d3c8b6; padding: 18px 0 14px">
      <svg viewBox="{{mapBox}}" style="width: 100%; height: {{mapHeight}}; display: block">
        <sc-for list="{{landPaths}}" as="p" hint-placeholder-count="3">
          <path d="{{p.d}}" fill="{{p.fill}}" stroke="{{p.stroke}}" stroke-width="1.1" stroke-linejoin="round"/>
        </sc-for>
        <sc-for list="{{mapMarks}}" as="m" hint-placeholder-count="3">
          <g class="hot" onClick="{{m.open}}">
            <circle class="mark" cx="{{m.x}}" cy="{{m.y}}" r="{{m.r}}" fill="{{m.fill}}" stroke="#ede6da" stroke-width="2"/>
          </g>
        </sc-for>
        <sc-for list="{{mapLabels}}" as="l" hint-placeholder-count="2">
          <text x="{{l.x}}" y="{{l.y}}" text-anchor="{{l.anchor}}" font-family="Archivo, sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.8" fill="#221b1a">{{l.text}}</text>
        </sc-for>
      </svg>
    </div>
  </sc-if>

  <sc-if value="{{showRows}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column">
      <span class="eyebrow" style="margin-bottom: 2px">{{rowsHeading}}</span>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <button class="row" onClick="{{r.open}}" style="{{r.style}}">
          <span style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 14.5px; color: #221b1a">{{r.name}}</span>
            <span style="font-size: 11.5px; line-height: 1.45; color: #69605c">{{r.note}}</span>
          </span>
          <span class="eyebrow" style="white-space: nowrap">{{r.count}}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{atWorld}}" hint-placeholder-val="{{ true }}">
    <div style="border: 1px solid #d3c8b6; background: #f2eee9; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
      <span class="eyebrow">Not on the map</span>
      <p style="margin: 0; font-size: 12.5px; line-height: 1.55; color: #514846">{{unplacedNote}}</p>
    </div>
  </sc-if>

  <sc-if value="{{atRegion}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 7px; flex-wrap: wrap">
        <sc-for list="{{regionGrapes}}" as="g" hint-placeholder-count="2">
          <span style="border: 1px solid #d3c8b6; background: #f2eee9; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; color: #514846">{{g.name}}</span>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; border-top: 1px solid #d3c8b6; padding-top: 12px">
        <span class="eyebrow" style="margin-bottom: 2px">{{bottlesHeading}}</span>
        <sc-for list="{{regionBottles}}" as="b" hint-placeholder-count="2">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 12px 0; border-bottom: 1px solid #d3c8b6">
            <span style="display: flex; flex-direction: column; gap: 2px">
              <span class="serif" style="font-size: 16.5px; color: #221b1a">{{b.name}}</span>
              <span style="font-size: 11.5px; color: #69605c">{{b.producer}}</span>
            </span>
            <span class="eyebrow" style="white-space: nowrap; color: {{b.ink}}">{{b.verdict}}</span>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px">
        <span class="eyebrow">What's next door</span>
        <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #514846">{{neighbours}}</p>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>

[165.1,56.2],"vinho-verde":[62.4,74.7],"douro":[79.3,89.9]},"worldMarks":{"IT":[177.2,64.4],"IB":[161.4,66.8]}};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { level: 'world', country: null, region: null };
  }

  countries() {
    return {
      IT: {
        name: 'Italy', geo: GEO.italy, height: '320px',
        regions: [
          { id: 'alto-piemonte', name: 'Alto Piemonte',
            note: 'Nebbiolo under the Alps — Boca, Ghemme, Colline Novaresi',
            label: { dx: 0, dy: -26, anchor: 'middle' },
            grapes: ['Nebbiolo', 'Vespolina'],
            next: 'Gattinara and Lessona are the next hills east — the same grape on the same glacial soils. Barolo is 100 km south and warmer.',
            bottles: [
              { name: 'Colline Novaresi Nebbiolo', producer: 'Le Piane', liked: true },
              { name: 'Boca', producer: 'Le Piane', liked: true } ] },
          { id: 'langhe', name: 'Langhe',
            note: 'Barolo, Barbaresco, and everyday Langhe Nebbiolo',
            label: { dx: -22, dy: 4, anchor: 'end' },
            grapes: ['Nebbiolo', 'Barbera', 'Dolcetto'],
            next: 'Roero is across the river, sandier and lighter. Alto Piemonte is the cooler version of the same grape.',
            bottles: [
              { name: 'Barolo Albe', producer: 'G.D. Vajra', liked: true },
              { name: 'Langhe Nebbiolo', producer: 'Produttori del Barbaresco', liked: true },
              { name: "Barbera d'Alba", producer: 'Vietti', liked: false } ] },
          { id: 'valdobbiadene', name: 'Valdobbiadene',
            note: 'The hill Prosecco comes from, above the flat DOC',
            label: { dx: 4, dy: -15, anchor: 'start' },
            grapes: ['Glera'],
            next: 'Asolo is the next hill east. Anything labelled just "Prosecco DOC" comes from the plain below these hills.',
            bottles: [ { name: 'Prosecco DOC', producer: 'Mionetto', liked: true } ] },
          { id: 'valpolicella', name: 'Valpolicella',
            note: 'Corvina in the hills above Verona — where Amarone is dried',
            label: null, grapes: ['Corvina', 'Rondinella'],
            next: 'Soave is the white from the next valley, very often the same producers.',
            bottles: [] },
          { id: 'chianti', name: 'Chianti Classico',
            note: 'Sangiovese between Florence and Siena',
            label: null, grapes: ['Sangiovese'],
            next: 'Montalcino is an hour south and makes Brunello from the same grape, riper.',
            bottles: [] }
        ] },
      IB: {
        name: 'Spain & Portugal', geo: GEO.iberia, height: '230px',
        regions: [
          { id: 'rioja-alta', name: 'Rioja Alta',
            note: 'The cooler, higher western third of Rioja — Haro is its town',
            label: { dx: 0, dy: -18, anchor: 'middle' },
            grapes: ['Tempranillo', 'Graciano'],
            next: 'Rioja Alavesa is just north across the Ebro; Rioja Oriental is warmer, further east.',
            bottles: [ { name: 'Viña Tondonia Reserva', producer: 'R. López de Heredia', liked: true } ] },
          { id: 'vinho-verde', name: 'Vinho Verde',
            note: 'The wet green north-west of Portugal, above the Douro',
            label: { dx: 0, dy: -21, anchor: 'middle' },
            grapes: ['Alvarinho', 'Loureiro', 'Trajadura'],
            next: 'Monção e Melgaço is its Alvarinho sub-zone, on the border opposite Rías Baixas.',
            bottles: [ { name: 'Alvarinho Trajadura', producer: 'Quinta da Raza', liked: true } ] },
          { id: 'douro', name: 'Douro',
            note: 'Terraced schist along the river — port, and increasingly not port',
            label: null, grapes: ['Touriga Nacional', 'Touriga Franca'],
            next: 'Dão is inland and cooler; Bairrada sits on the coast.',
            bottles: [] }
        ] }
    };
  }

  renderVals() {
    const accent = this.props.accent ?? '#8a2632';
    const showUnvisited = this.props.showUnvisited ?? true;
    const { level, country, region } = this.state;
    const all = this.countries();
    const go = (next) => this.setState(next);
    const plural = (n) => (n === 1 ? '1 bottle' : n + ' bottles');
    const countOf = (key) => all[key].regions.reduce((n, r) => n + r.bottles.length, 0);

    const land = (geo, fill, stroke) => geo.paths.map((d) => ({ d, fill, stroke }));

    // ---------- world ----------
    if (level === 'world') {
      const places = [
        { key: 'IT', xy: GEO.worldMarks.IT, note: 'Piemonte, Veneto, Toscana' },
        { key: 'IB', xy: GEO.worldMarks.IB, note: 'Rioja, Vinho Verde, Douro' }
      ];
      const marks = places.map((p) => ({
        x: p.xy[0], y: p.xy[1], r: 3.5 + countOf(p.key) * 0.95, fill: accent,
        open: () => go({ level: 'country', country: p.key, region: null })
      }));
      return {
        title: 'Where they came from',
        subtitle: 'Eight of your ten bottles place on the map. Tap a mark to go closer.',
        atWorld: true, atRegion: false, inCountry: false, inRegion: false,
        showMap: true, showRows: true,
        mapBox: GEO.world.box, mapHeight: '190px',
        landPaths: land(GEO.world, '#e0d5c2', '#c3b7a2'),
        mapMarks: marks, mapLabels: [],
        rowsHeading: 'Where you drink',
        rows: places.map((p) => ({
          name: all[p.key].name, note: p.note, count: plural(countOf(p.key)), style: '',
          open: () => go({ level: 'country', country: p.key, region: null })
        })),
        unplacedNote: 'Two bottles have no region on the label — a supermarket Prosecco and a Rioja that says only "Spain". They stay in the list rather than being guessed onto a hillside.',
        worldCrumbStyle: 'color: #221b1a', countryCrumbStyle: '',
        goWorld: () => go({ level: 'world', country: null, region: null }),
        goCountry: () => go({ level: 'country', region: null }),
        countryName: '', regionName: '', regionGrapes: [], regionBottles: [], bottlesHeading: '', neighbours: ''
      };
    }

    // ---------- country ----------
    const here = all[country];
    const visible = here.regions.filter((r) => showUnvisited || r.bottles.length > 0);
    const markFor = (r) => {
      const xy = GEO.marks[r.id];
      const n = r.bottles.length;
      return { r, xy, n, radius: n === 0 ? 3.5 : 5 + n * 2 };
    };

    if (level === 'country') {
      const built = visible.map(markFor);
      return {
        title: here.name,
        subtitle: 'Tap a region to see what you drank from it — and what sits next to it.',
        atWorld: false, atRegion: false, inCountry: true, inRegion: false,
        showMap: true, showRows: true,
        mapBox: here.geo.box, mapHeight: here.height,
        landPaths: land(here.geo, '#e5dbcb', '#221b1a'),
        mapMarks: built.map((b) => ({
          x: b.xy[0], y: b.xy[1], r: b.radius, fill: b.n === 0 ? '#c3b7a2' : accent,
          open: () => go({ level: 'region', country, region: b.r.id })
        })),
        mapLabels: built.filter((b) => b.r.label).map((b) => ({
          x: b.xy[0] + b.r.label.dx, y: b.xy[1] + b.r.label.dy,
          anchor: b.r.label.anchor, text: b.r.name
        })),
        rowsHeading: 'Regions',
        rows: visible.map((r) => ({
          name: r.name, note: r.note,
          count: r.bottles.length === 0 ? 'None yet' : plural(r.bottles.length),
          style: r.bottles.length === 0 ? 'opacity: .55' : '',
          open: () => go({ level: 'region', country, region: r.id })
        })),
        unplacedNote: '',
        worldCrumbStyle: 'color: #69605c; text-decoration: underline; text-underline-offset: 3px',
        countryCrumbStyle: 'color: #221b1a',
        goWorld: () => go({ level: 'world', country: null, region: null }),
        goCountry: () => go({ level: 'country', region: null }),
        countryName: here.name, regionName: '',
        regionGrapes: [], regionBottles: [], bottlesHeading: '', neighbours: ''
      };
    }

    // ---------- region ----------
    const chosen = here.regions.find((r) => r.id === region);
    const built = visible.map(markFor);
    return {
      title: chosen.name,
      subtitle: chosen.note,
      atWorld: false, atRegion: true, inCountry: true, inRegion: true,
      showMap: true, showRows: false,
      mapBox: here.geo.box, mapHeight: here.height,
      landPaths: land(here.geo, '#e5dbcb', '#221b1a'),
      mapMarks: built.map((b) => ({
        x: b.xy[0], y: b.xy[1], r: b.radius,
        fill: b.r.id === chosen.id ? accent : '#c3b7a2',
        open: () => go({ level: 'region', country, region: b.r.id })
      })),
      mapLabels: [{
        x: GEO.marks[chosen.id][0] + (chosen.label ? chosen.label.dx : 0),
        y: GEO.marks[chosen.id][1] + (chosen.label ? chosen.label.dy : -14),
        anchor: chosen.label ? chosen.label.anchor : 'middle',
        text: chosen.name
      }],
      rowsHeading: '', rows: [], unplacedNote: '',
      worldCrumbStyle: 'color: #69605c; text-decoration: underline; text-underline-offset: 3px',
      countryCrumbStyle: 'color: #69605c; text-decoration: underline; text-underline-offset: 3px',
      goWorld: () => go({ level: 'world', country: null, region: null }),
      goCountry: () => go({ level: 'country', region: null }),
      countryName: here.name, regionName: chosen.name,
      regionGrapes: chosen.grapes.map((name) => ({ name })),
      regionBottles: chosen.bottles.map((b) => ({
        name: b.name, producer: b.producer,
        verdict: b.liked ? 'Liked it' : "Didn't like it",
        ink: b.liked ? accent : '#69605c'
      })),
      bottlesHeading: chosen.bottles.length === 1 ? 'Your bottle' : 'Your bottles',
      neighbours: chosen.next
    };
  }
}
