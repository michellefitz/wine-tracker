<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" />
    <title>Offline — Cellar Notes</title>
    <style>
      html {
        background: #fbfaf7;
        color: #17140f;
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2rem;
        font-weight: 400;
        letter-spacing: -0.01em;
        margin: 0;
      }
      hr {
        border: 0;
        border-top: 1px solid #e5e0d8;
        width: 3rem;
        margin: 1.75rem auto;
      }
      p {
        color: #8c857c;
        margin: 0 0 2rem;
        max-width: 21rem;
        line-height: 1.6;
        font-size: 0.9375rem;
      }
      button {
        background: #17140f;
        color: #fbfaf7;
        border: 0;
        border-radius: 999px;
        padding: 0.9rem 2rem;
        font: inherit;
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.14em;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>No connection</h1>
      <hr />
      <p>
        Your log lives on the server, so it needs a signal. Supermarket aisles are
        famously bad for this — try again by the door.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
