<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — Cellar Notes</title>
    <style>
      html {
        background: #141010;
        color: #f5ece8;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.75rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #a5938c;
        margin: 0 0 1.5rem;
        max-width: 22rem;
      }
      button {
        background: #a01f45;
        color: #fff;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.85rem 1.5rem;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>No connection</h1>
      <p>
        Your log lives on the server, so it needs a signal. Supermarket aisles are famously
        bad for this — try again by the door.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
